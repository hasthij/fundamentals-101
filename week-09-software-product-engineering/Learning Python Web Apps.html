<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Python Web Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Literata:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sticky chapter outline beside one calm reading column. Each chapter opens with its key idea; each part opens with a one-line summary. */
:root{
  --accent-light:#0f6b5c; --accent-dark:#5cc9b0;
  --bg:#f5f7f7; --surface:#ffffff; --ink:#141b1f; --muted:#56646c;
  --line:#dbe2e5; --code:#edf1f2; --on-accent:#ffffff;
  --c-com:#5d6b75;--c-str:#1b6e3c;--c-kw:#8f3b9e;--c-fn:#1d56b0;--c-num:#a34a00;--c-dec:#0c6a7a;--c-tag:#b02f4a;--c-attr:#8a5200;
  --accent:var(--accent-light);
  --tint:color-mix(in srgb,var(--accent) 9%,var(--surface));
  --warn:#a34a00; --warn-bg:color-mix(in srgb,#e08a2c 12%,var(--surface));
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-prose:"Literata",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
:root[data-accent="indigo"]{--accent-light:#3b4fc4;--accent-dark:#9aa8ff}
:root[data-accent="graphite"]{--accent-light:#2f3a45;--accent-dark:#c3ccd6}
:root[data-accent="ember"]{--accent-light:#b4501a;--accent-dark:#f0a068}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1317;--surface:#141b21;--ink:#e7edf1;--muted:#9aa8b2;--line:#26313a;--code:#1a232a;--on-accent:#0b1210;
    --c-com:#8797a3;--c-str:#8fd6a0;--c-kw:#d59bf0;--c-fn:#86b4ff;--c-num:#f2b077;--c-dec:#6fd3e0;--c-tag:#ff8fa3;--c-attr:#e5c07b;
    --accent:var(--accent-dark);--warn:#f2b077;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1317;--surface:#141b21;--ink:#e7edf1;--muted:#9aa8b2;--line:#26313a;--code:#1a232a;--on-accent:#0b1210;
  --c-com:#8797a3;--c-str:#8fd6a0;--c-kw:#d59bf0;--c-fn:#86b4ff;--c-num:#f2b077;--c-dec:#6fd3e0;--c-tag:#ff8fa3;--c-attr:#e5c07b;
  --accent:var(--accent-dark);--warn:#f2b077;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font-ui);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}

/* top bar */
.top{max-width:1160px;margin:0 auto;padding:26px 24px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:1.55rem;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.ctrl{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:8px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:transform .15s ease,box-shadow .15s ease}
.dot:hover{transform:scale(1.12)}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.dot[data-a="pine"]{background:#0f6b5c}.dot[data-a="indigo"]{background:#3b4fc4}
.dot[data-a="graphite"]{background:#2f3a45}.dot[data-a="ember"]{background:#b4501a}
.mode{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:border-color .15s ease}
.mode:hover{border-color:var(--accent)}
.mode svg{width:18px;height:18px}

/* day tabs */
.days{max-width:1160px;margin:18px auto 0;padding:0 24px}
nav{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav button{font:500 1rem var(--font-ui);color:var(--muted);background:none;border:0;padding:12px 18px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:color .18s ease}
nav button:hover,nav button[aria-selected="true"]{color:var(--ink)}
nav .count{font:500 .74rem var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
#ind{position:absolute;left:0;bottom:-1px;height:2px;width:100px;background:var(--accent);transition:transform .3s cubic-bezier(.3,.7,.2,1),width .3s cubic-bezier(.3,.7,.2,1)}

/* shell */
.shell{max-width:1160px;margin:0 auto;padding:30px 24px 90px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:56px}
aside{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
.toc-box[hidden]{display:none}
.th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.th b{font-weight:600}
.th span{font:500 .76rem var(--font-mono);color:var(--muted)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .45s cubic-bezier(.3,.7,.2,1)}
ol.toc{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.toc a{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:8px 10px 8px 14px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;font-size:.9rem;line-height:1.35;transition:color .15s ease,border-color .15s ease,background .15s ease}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);border-left-color:var(--accent);background:var(--tint)}
.toc .tk{width:16px;height:16px;border:1.5px solid var(--line);border-radius:50%;margin-top:2px;display:grid;place-items:center;transition:background .2s,border-color .2s}
.toc .tk svg{width:9px;height:9px;stroke:var(--on-accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.toc a.rd .tk{background:var(--accent);border-color:var(--accent)}
.toc a.rd .tk svg{opacity:1}
.toc .tm{display:block;font:400 .72rem var(--font-mono);color:var(--muted);margin-top:2px}

/* main */
main{min-width:0}
.panel[hidden]{display:none}
.panel{animation:swap .3s cubic-bezier(.3,.7,.2,1)}
@keyframes swap{from{transform:translateY(8px)}to{transform:none}}
.dayhead h2{font-size:2rem;line-height:1.15;margin:0 0 10px;font-weight:600;letter-spacing:-.02em;text-wrap:balance;max-width:20ch}
.dayhead p{font:400 1.08rem/1.6 var(--font-prose);color:var(--muted);margin:0 0 20px;max-width:56ch}
details.terms{margin:0 0 40px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.terms summary{cursor:pointer;padding:12px 18px;font-weight:500;font-size:.95rem;list-style:none;display:flex;justify-content:space-between}
details.terms summary::after{content:"+";color:var(--muted);font-family:var(--font-mono)}
details.terms[open] summary::after{content:"\2212"}
dl.tgrid{margin:0;padding:0 18px 8px;display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
dl.tgrid>div{padding:9px 0;border-top:1px solid var(--line)}
dl.tgrid dt{font-weight:600;font-size:.9rem}
dl.tgrid dd{margin:2px 0 0;color:var(--muted);font:400 .9rem/1.5 var(--font-prose)}

/* chapter */
.chap{scroll-margin-top:70px;padding-bottom:28px;margin-bottom:60px;border-bottom:1px solid var(--line)}
.chap:last-of-type{border-bottom:0}
.meta{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.clock{font:500 .85rem var(--font-mono);color:var(--accent)}
.mins{font:400 .76rem var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 9px}
.chap h3{font-size:1.75rem;line-height:1.2;margin:0 0 8px;font-weight:600;letter-spacing:-.018em;text-wrap:balance}
.goal{font:italic 400 1.08rem/1.55 var(--font-prose);color:var(--muted);margin:0 0 22px;max-width:56ch}
.key{display:flex;gap:14px;background:var(--tint);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:12px;padding:16px 18px;margin:0 0 34px}
.key svg{flex:none;width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.key b{display:block;font:600 .82rem var(--font-ui);color:var(--accent);margin-bottom:2px}
.key div{font:500 1.06rem/1.55 var(--font-prose)}

.part{margin:0 0 38px}
.part h4{font-size:1.08rem;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.part h4::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none}
.part p.lead{font:500 1.12rem/1.5 var(--font-prose);margin:0 0 16px;max-width:58ch}
.part p{font:400 1.02rem/1.75 var(--font-prose);margin:0 0 14px;max-width:64ch}
code{font-family:var(--font-mono);font-size:.84em;background:var(--code);padding:1px 6px;border-radius:5px}
b{font-weight:600}

/* code */
figure.code{margin:16px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code)}
figure.code figcaption{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;border-bottom:1px solid var(--line);font:400 .76rem var(--font-mono);color:var(--muted)}
.fnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{font-family:var(--font-ui);font-size:.74rem}
.cp{font:500 .74rem var(--font-ui);color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer;transition:color .15s,border-color .15s}
.cp:hover{color:var(--ink);border-color:var(--accent)}
figure.code pre{margin:0;padding:14px 16px;overflow-x:auto;font:400 .82rem/1.65 var(--font-mono);color:var(--ink)}
pre code{background:none;padding:0;font-size:inherit;border-radius:0}
.out{border-top:1px solid var(--line);padding:8px 16px;font:400 .8rem/1.5 var(--font-mono);color:var(--muted);white-space:pre-wrap}
.out span{margin-right:12px;color:var(--accent)}
.s-com{color:var(--c-com);font-style:italic}.s-str{color:var(--c-str)}.s-kw{color:var(--c-kw)}.s-fn{color:var(--c-fn)}
.s-num{color:var(--c-num)}.s-dec{color:var(--c-dec)}.s-tag{color:var(--c-tag)}.s-attr{color:var(--c-attr)}

/* breakdown */
details.bd{margin:6px 0 16px}
details.bd summary{cursor:pointer;font:600 .86rem var(--font-ui);color:var(--accent);padding:4px 0;list-style:none;display:inline-flex;gap:8px;align-items:center}
details.bd summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .2s}
details.bd[open] summary::before{transform:rotate(45deg)}
ul.bdl{list-style:none;margin:8px 0 0;padding:0 0 0 4px;border-left:2px solid var(--line)}
ul.bdl li{padding:9px 0 9px 18px;position:relative}
ul.bdl li code{display:inline-block;margin-bottom:3px;font-size:.8rem;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code)}
ul.bdl li span{display:block;font:400 .97rem/1.6 var(--font-prose);max-width:60ch}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:16px 0;background:var(--surface)}
.tw table{width:100%;border-collapse:collapse;font-size:.9rem}
.tw th,.tw td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tw th{font-weight:600;font-size:.82rem;color:var(--muted);background:var(--code);white-space:nowrap}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{font-weight:500}

/* steps */
ol.steps{counter-reset:s;list-style:none;margin:16px 0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:4px 0 18px 46px;font:400 1.02rem/1.6 var(--font-prose)}
ol.steps li:last-child{padding-bottom:4px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border:1.5px solid var(--accent);background:var(--surface);border-radius:50%;display:grid;place-items:center;font:500 .8rem var(--font-ui);color:var(--accent);z-index:1;font-variant-numeric:tabular-nums}
ol.steps li::after{content:"";position:absolute;left:13.5px;top:30px;bottom:-2px;width:1px;background:var(--line)}
ol.steps li:last-child::after{display:none}

/* callouts */
.note,.bad{display:flex;gap:12px;margin:18px 0;padding:13px 16px;border-radius:10px;font:400 .98rem/1.6 var(--font-prose)}
.note{background:var(--tint);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.bad{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.note svg,.bad svg{flex:none;width:19px;height:19px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:3px}
.note svg{stroke:var(--accent)}.bad svg{stroke:var(--warn)}
.note b,.bad b{display:block;font:600 .82rem var(--font-ui);margin-bottom:1px}
.note b{color:var(--accent)}.bad b{color:var(--warn)}

/* chapter footer */
.chfoot{margin-top:6px}
.read{display:inline-flex;align-items:center;gap:10px;font:500 .92rem var(--font-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;transition:border-color .15s,background .2s,color .2s}
.read:hover{border-color:var(--accent)}
.rb{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;transition:background .2s,border-color .2s}
.rb svg{width:10px;height:10px;stroke:var(--on-accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .3s ease .05s}
.read[aria-pressed="true"]{background:var(--tint);border-color:var(--accent)}
.read[aria-pressed="true"] .rb{background:var(--accent);border-color:var(--accent)}
.read[aria-pressed="true"] .rb svg{stroke-dashoffset:0}

/* checkpoints */
.cps{scroll-margin-top:70px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin-top:20px}
.cps h3{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.01em}
.cps .sub{font:400 .98rem var(--font-prose);color:var(--muted);margin:0 0 14px}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:32px}
.cols h5{font-size:.9rem;margin:0 0 8px;font-weight:600}
ul.done,ul.watch{list-style:none;margin:0;padding:0}
ul.done li{border-bottom:1px solid var(--line)}ul.done li:last-child{border:0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer;font:400 .98rem/1.5 var(--font-prose)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;margin-top:2px;display:grid;place-items:center;transition:background .18s,border-color .18s}
.box svg{width:12px;height:12px;stroke:var(--on-accent);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18;stroke-dashoffset:18;transition:stroke-dashoffset .25s ease .05s}
.chk input:checked + .box{background:var(--accent);border-color:var(--accent)}
.chk input:checked + .box svg{stroke-dashoffset:0}
.chk input:checked ~ .lab{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
ul.watch li{padding:8px 0 8px 16px;position:relative;font:400 .94rem/1.55 var(--font-prose);color:var(--muted);border-bottom:1px solid var(--line)}
ul.watch li:last-child{border:0}
ul.watch li::before{content:"";position:absolute;left:0;top:18px;width:7px;height:2px;background:var(--warn)}

/* responsive */
@media (max-width:920px){
  .shell{display:block;padding-top:18px}
  aside{position:sticky;top:0;z-index:5;max-height:none;background:var(--bg);margin:0 -24px 22px;padding:8px 24px;border-bottom:1px solid var(--line);overflow-x:auto}
  .th,.bar{display:none}
  ol.toc{display:flex;gap:6px;border:0}
  .toc a{display:block;white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:6px 14px;margin:0}
  .toc a.on{border-color:var(--accent)}
  .toc .tk,.toc .tm{display:none}
  .chap h3{font-size:1.5rem}
  .cols,dl.tgrid{grid-template-columns:1fr}
  .dayhead h2{font-size:1.7rem}
}
@media (max-width:560px){.top,.days,.shell{padding-left:16px;padding-right:16px}aside{margin:0 -16px 22px;padding:8px 16px}.cps{padding:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Learning Python Web Apps</h1>
  <div class="ctrl">
    <div class="dots" role="group" aria-label="Colour theme">
      <button class="dot" data-a="pine" aria-label="Pine" title="Pine"></button>
      <button class="dot" data-a="indigo" aria-label="Indigo" title="Indigo"></button>
      <button class="dot" data-a="graphite" aria-label="Graphite" title="Graphite"></button>
      <button class="dot" data-a="ember" aria-label="Ember" title="Ember"></button>
    </div>
    <button class="mode" id="mode" aria-label="Switch between light and dark" title="Light or dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<div class="days"><nav role="tablist" aria-label="Days" id="tabs"><span id="ind"></span></nav></div>
<div class="shell">
  <aside id="toc" aria-label="Chapters"></aside>
  <main id="panels"></main>
</div>

<script>
function P(t){return {k:"p",t:t};}
function C(n,l,c,out){return {k:"c",n:n,l:l,c:c,out:out};}
function X(rows,title){return {k:"x",rows:rows,title:title};}
function T(head,rows,raw){return {k:"t",head:head,rows:rows,raw:raw};}
function S(items){return {k:"s",items:items};}
function N(t,title){return {k:"n",t:t,title:title};}
function B(t){return {k:"b",t:t};}

var DAYS=[
/* ===================== DAY 1 ===================== */
{id:"day-1",name:"Day 1",goal:"How the web works, Flask pages, forms and databases",
 sub:"Web basics, Python, Flask, forms, styling, Git, and storing data with SQL. The checkpoints at the end help you practise on a small app of your own.",
 terms:[
  ["Client and server","The browser asks (client). The program holding the site answers (server)."],
  ["Request and response","One message asking, and the one message answering."],
  ["Route","A rule that links an address such as /about to a Python function."],
  ["Template","An HTML file with gaps that Flask fills with data."],
  ["Virtual environment","A private toolbox of packages for one project."],
  ["Commit","A saved snapshot of your project in Git."],
  ["Table, row, column","A table holds records. A row is one record. A column is one property."],
  ["Primary key","A unique number that identifies one row."],
  ["Foreign key","A column that holds another table's primary key. It links rows."]
 ],
 blocks:[
 {t:"0:00",m:20,h:"What happens when you open a web page?",
  aim:"Read a URL, a request and a response.",
  key:"Opening a page is one question and one answer. Everything in this course builds on that.",
  parts:[
  {h:"Two programs, two messages",lead:"Your browser asks. A server answers.",body:[
   P(`Your browser is the <b>client</b>. The computer that holds the website is the <b>server</b>. The browser sends a <b>request</b>: "please give me this page". The server sends back one <b>response</b>: the page, or an error.`),
   P(`Think of ordering at a counter. You ask, they hand it over. They do not remember you afterwards unless you show a card. That card idea comes back on Day 2.`)]},
  {h:"Reading a URL",lead:"A URL is an address made of five parts.",body:[
   C("One URL","txt",`https://shop.example.com:443/products/42?colour=red&page=2`),
   T(["Piece","Name","What it means"],[
    ["https://","scheme","How to talk. HTTPS is the secure way."],
    ["shop.example.com","host","Which computer to ask."],
    [":443","port","Which door on that computer. Usually hidden. Flask uses 5000."],
    ["/products/42","path","Which page you want. Flask matches this."],
    ["?colour=red&page=2","query string","Extra details as name=value pairs, joined by &."]])]},
  {h:"The request",lead:"A request is a short text message from the browser.",body:[
   C("A request","txt",`GET /products/42?colour=red HTTP/1.1
Host: shop.example.com
Cookie: session=abc123
Accept: text/html`),
   X([["GET","What you want to do."],
      ["/products/42?colour=red","Which page, plus extra details."],
      ["HTTP/1.1","The language version. You can ignore it."],
      ["Host:","Which website."],
      ["Cookie:","A small note the browser sends back each time. It lets a site recognise you."],
      ["Accept:","What kinds of answer the browser can read."]])]},

}`),

 {t:"3:15",m:20,h:"How do I read an error and find the bug?",

  key:"Read the last line of an error first. Then find the nearest line that is in your own file.",
  parts:[
  {h:"Reading a traceback",lead:"Start at the bottom.",body:[
   C("An error in the terminal","txt",`Traceback (most recent call last):
  File "app.py", line 14, in add
    qty = int(request.form["qty"])
ValueError: invalid literal for int() with base 10: 'abc'`),
   S([`Read the <b>last line</b> first. It names the error and explains it.`,
      `Look at the lines above. They show the chain of calls. The one nearest the bottom that is in <b>your</b> file is where to look.`,
      `Open that line. Here it is line 14: the text <code>abc</code> cannot become a number.`])]},
  {h:"Errors you will meet",lead:"Most bugs are one of these.",body:[
   T(["Error","Usual cause","Fix"],[
    ["TemplateNotFound","File is not in templates/, or is misspelt","Check folder and spelling"],
    ["405 Method Not Allowed","The route does not allow that method","Add methods=[\"GET\", \"POST\"]"],
    ["400 Bad Request","The form box has no name","Add name=\"x\" to the input"],
    ["BuildError from url_for","Wrong function name","Use the exact view name"],
    ["no such table","schema.sql did not run, or wrong file","Run init_db, check the file name"],
    ["IntegrityError","A UNIQUE or foreign key rule was broken","Catch it and show a message"],
    ["UndefinedError in a template","A variable was not passed in","Pass it from the view"]]),
   P(`Start with the terminal. Flask prints every request and every error there. With <code>--debug</code>, the browser shows the traceback too.`),

 {t:"3:35",m:40,h:"How do I put my app on the internet?",
  aim:"Know what a host needs, and deploy.",
  key:"A host needs three things from you: a package list, a production server, and settings kept outside your code.",
  parts:[

    ["A production server","Flask's own server is for development only","<b>gunicorn</b>, a WSGI server"],

  {h:"The commands",lead:"Three commands cover it.",body:[

pip freeze > requirements.txt

# start command to enter on the host
gunicorn app:app

# generate a secret key to paste into the host's settings
python -c "import secrets; print(secrets.token_hex(32))"`),
   X([["pip freeze > requirements.txt","Write every installed package and its version to a file. Install gunicorn first."],
      ["gunicorn app:app","In the file app.py, run the object named app."],
      ["secrets.token_hex(32)","Make a random key. Save it as SECRET_KEY on the host."]]),
   P(`gunicorn does not run on Windows, so keep using <code>flask run</code> on your laptop. The host is normally Linux.`)]},
  {h:"The deploy flow",lead:"Push, connect, set, deploy, test.",body:[

  {h:"Will my data survive?",lead:"Test it. Many free hosts wipe the disk on restart.",body:[

var CHECK='<svg viewBox="0 0 12 12"><path d="M2 6.5 5 9.5 10 3"/></svg>';
var ICON_KEY='<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>';
var ICON_NOTE='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
var ICON_WARN='<svg viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3zM12 10v4.5M12 17.5h.01"/></svg>';
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
var saved=JSON.parse(store.get("exp-done-2day")||"{}");

var LANG={py:"Python",html:"HTML + Jinja",sql:"SQL",css:"CSS",sh:"Terminal",md:"Markdown",txt:"Text"};
var FLAGS={sql:"gi",sh:"gm",md:"gm",txt:"gm"};
var RULES={
 py:[["com",/#[^\n]*/],["str",/[fFrRbB]{0,2}(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')/],["dec",/@[A-Za-z_][\w.]*/],["kw",/\b(?:from|import|def|return|if|elif|else|for|in|not|and|or|is|None|True|False|try|except|with|as|while|class|pass|raise|lambda)\b/],["fn",/\b[A-Za-z_]\w*(?=\()/],["num",/\b\d+(?:\.\d+)?\b/]],
 sql:[["com",/--[^\n]*/],["str",/'(?:[^']|'')*'/],["kw",/\b(?:SELECT|FROM|WHERE|AND|OR|NOT|NULL|JOIN|ON|GROUP BY|ORDER BY|DESC|ASC|AS|INSERT INTO|VALUES|CREATE TABLE|IF NOT EXISTS|PRIMARY KEY|UNIQUE|REFERENCES|CHECK|IN|CASE|WHEN|THEN|ELSE|END|UPDATE|SET|DELETE|PRAGMA)\b/],["tag",/\b(?:INTEGER|TEXT|REAL)\b/],["fn",/\b[A-Za-z_]\w*(?=\()/],["num",/\b\d+\b/]],
 html:[["com",/<!--[\s\S]*?-->/],["dec",/\{%[\s\S]*?%\}|\{\{[\s\S]*?\}\}/],["tag",/<\/?[A-Za-z!][\w-]*/],["str",/"[^"]*"/],["attr",/[\w:-]+(?==)/],["tag",/\/?>/]],
 css:[["com",/\/\*[\s\S]*?\*\//],["str",/"[^"]*"|'[^']*'/],["kw",/@[\w-]+/],["attr",/[a-z-]+(?=\s*:)/],["num",/#[0-9a-fA-F]{3,8}\b/],["tag",/[.#][A-Za-z_][\w-]*/],["num",/-?\.?\d+(?:\.\d+)?(?:px|rem|em|%|vh|vw)?/]],
 sh:[["com",/#[^\n]*/],["str",/"(?:\\.|[^"\\\n])*"|'[^']*'/],["attr",/\s--?[A-Za-z][\w-]*(?=\s|=|$)/],["fn",/^(?:git|python|pip|flask|gunicorn)\b/]],
 md:[["kw",/^#{1,6} .*/],["fn",/`[^`]*`/]],
 txt:[["kw",/\b(?:GET|POST)\b|HTTP\/1\.1/],["num",/\b(?:200|302|404)\b/],["attr",/^[A-Za-z-]+(?=:)/],["tag",/<\/?[A-Za-z]+>?/]]
};
function hl(code,lang){
  var rules=RULES[lang]; if(!rules) return esc(code);
  var re=new RegExp(rules.map(function(r){return "("+r[1].source+")";}).join("|"),FLAGS[lang]||"g");
  var out="",last=0,m;
  while((m=re.exec(code))){
    if(m[0]===""){re.lastIndex++;continue;}
    var k=0;for(var i=1;i<m.length;i++){if(m[i]!==undefined){k=i-1;break;}}
    out+=esc(code.slice(last,m.index))+'<span class="s-'+rules[k][0]+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(code.slice(last));
}
function tableHtml(t){
  var head='<tr>'+t.head.map(function(h){return '<th>'+h+'</th>';}).join("")+'</tr>';
  var rows=t.rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td>'+((i===0&&!t.raw)?'<code>'+esc(c)+'</code>':c)+'</td>';}).join("")+'</tr>';}).join("");
  return '<div class="tw"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
}
function codeHtml(c){
  return '<figure class="code"><figcaption><span class="fnm">'+esc(c.n||"")+'</span><span class="lang">'+LANG[c.l]+'</span><button type="button" class="cp">Copy</button></figcaption><pre><code>'+hl(c.c,c.l)+'</code></pre>'+(c.out?'<div class="out"><span>Output</span>'+esc(c.out)+'</div>':'')+'</figure>';
}
function item(it){
  if(it.k==="p")return '<p>'+it.t+'</p>';
  if(it.k==="c")return codeHtml(it);
  if(it.k==="x")return '<details class="bd" open><summary>'+(it.title||"What each part means")+'</summary><ul class="bdl">'+it.rows.map(function(e){return '<li><code>'+esc(e[0])+'</code><span>'+e[1]+'</span></li>';}).join("")+'</ul></details>';
  if(it.k==="t")return tableHtml(it);
  if(it.k==="s")return '<ol class="steps">'+it.items.map(function(s){return '<li>'+s+'</li>';}).join("")+'</ol>';
  if(it.k==="n")return '<div class="note">'+ICON_NOTE+'<div><b>'+(it.title||"Remember")+'</b>'+it.t+'</div></div>';
  if(it.k==="b")return '<div class="bad">'+ICON_WARN+'<div><b>Common mistake</b>'+it.t+'</div></div>';
  return "";
}
function part(pt){return '<section class="part"><h4>'+pt.h+'</h4>'+(pt.lead?'<p class="lead">'+pt.lead+'</p>':'')+pt.body.map(item).join("")+'</section>';}
function chapter(d,x,i){
  var id='c-'+d.id+'-'+i;
  return '<article class="chap" id="'+id+'"><header><div class="meta"><span class="clock">'+x.t+'</span><span class="mins">'+x.m+' min</span></div><h3>'+x.h+'</h3>'+(x.aim?'<p class="goal">'+x.aim+'</p>':'')+'</header>'
   +(x.key?'<div class="key">'+ICON_KEY+'<div><b>Key idea</b>'+x.key+'</div></div>':'')
   +x.parts.map(part).join("")
   +'<footer class="chfoot"><button type="button" class="read" data-c="'+id+'" aria-pressed="false"><span class="rb">'+CHECK+'</span><span>Mark chapter as read</span></button></footer></article>';
}

var tabs=document.getElementById("tabs"), panels=document.getElementById("panels"), ind=document.getElementById("ind"), tocBox=document.getElementById("toc");
DAYS.forEach(function(d){
  var b=document.createElement("button");
  b.setAttribute("role","tab");b.id="t-"+d.id;b.dataset.id=d.id;b.setAttribute("aria-selected","false");
  b.innerHTML=d.name+' <span class="count" id="cnt-'+d.id+'"></span>';
  tabs.appendChild(b);

  var s=document.createElement("section");
  s.className="panel";s.id=d.id;s.setAttribute("role","tabpanel");s.setAttribute("aria-labelledby","t-"+d.id);s.hidden=true;
  var terms='<details class="terms"><summary>Words you will meet today</summary><dl class="tgrid">'+d.terms.map(function(t){return '<div><dt>'+t[0]+'</dt><dd>'+t[1]+'</dd></div>';}).join("")+'</dl></details>';
  var done=d.done.map(function(x,j){var key=d.id+"-"+j;return '<li><label class="chk"><input type="checkbox" data-k="'+key+'"><span class="box">'+CHECK+'</span><span class="lab">'+x+'</span></label></li>';}).join("");
  var watch=d.watch.map(function(x){return '<li>'+x+'</li>';}).join("");
  s.innerHTML='<div class="dayhead"><h2>'+d.goal+'</h2><p>'+d.sub+'</p></div>'+terms
    +d.blocks.map(function(x,i){return chapter(d,x,i);}).join("")
    +'<section class="cps" id="cp-'+d.id+'"><h3>Practice checkpoints</h3><p class="sub">Practise today\'s chapters on a small app of your own. Tick each when it works.</p><div class="cols"><div><h5>Done when</h5><ul class="done">'+done+'</ul></div><div><h5>Watch out</h5><ul class="watch">'+watch+'</ul></div></div></section>';
  panels.appendChild(s);

  var t=document.createElement("div");t.className="toc-box";t.id="toc-"+d.id;t.hidden=true;
  t.innerHTML='<div class="th"><b>'+d.name+'</b><span id="tp-'+d.id+'"></span></div><div class="bar"><i id="tb-'+d.id+'"></i></div><ol class="toc">'
    +d.blocks.map(function(x,i){var id='c-'+d.id+'-'+i;return '<li><a href="#" data-go="'+id+'" id="ti-'+id+'"><span class="tk">'+CHECK+'</span><span><span class="tt">'+x.h+'</span><span class="tm">'+x.t+' · '+x.m+' min</span></span></a></li>';}).join("")
    +'<li><a href="#" data-go="cp-'+d.id+'" id="ti-cp-'+d.id+'"><span class="tk">'+CHECK+'</span><span><span class="tt">Practice checkpoints</span><span class="tm">Apply it</span></span></a></li></ol>';
  tocBox.appendChild(t);
});

function progress(){
  DAYS.forEach(function(d){
    var n=d.blocks.length,c=0;
    d.blocks.forEach(function(x,i){
      var id='c-'+d.id+'-'+i,on=!!saved["r-"+id];
      if(on)c++;
      var a=document.getElementById("ti-"+id);if(a)a.classList.toggle("rd",on);
      var rb=document.querySelector('.read[data-c="'+id+'"]');
      if(rb){rb.setAttribute("aria-pressed",String(on));rb.lastElementChild.textContent=on?"Chapter read":"Mark chapter as read";}
    });
    document.getElementById("cnt-"+d.id).textContent=c+"/"+n;
    document.getElementById("tp-"+d.id).textContent=c+" of "+n+" read";
    document.getElementById("tb-"+d.id).style.transform="scaleX("+(c/n)+")";
    var cpDone=d.done.every(function(_,j){return saved[d.id+"-"+j];});
    document.getElementById("ti-cp-"+d.id).classList.toggle("rd",cpDone);
  });
  [].forEach.call(document.querySelectorAll('.chk input'),function(i){i.checked=!!saved[i.dataset.k];});
}
document.addEventListener("click",function(e){
  var r=e.target.closest(".read");
  if(r){var k="r-"+r.dataset.c;saved[k]=!saved[k];store.set("exp-done-2day",JSON.stringify(saved));progress();return;}
  var cp=e.target.closest(".cp");
  if(cp){
    var txt=cp.closest("figure").querySelector("code").textContent;
    var ok=function(v){cp.textContent=v;setTimeout(function(){cp.textContent="Copy";},1500);};
    try{navigator.clipboard.writeText(txt).then(function(){ok("Copied");},function(){ok("Select manually");});}catch(err){ok("Select manually");}
    return;
  }
  var g=e.target.closest("[data-go]");
  if(g){e.preventDefault();var el=document.getElementById(g.dataset.go);if(el)el.scrollIntoView({block:"start"});}
});
panels.addEventListener("change",function(e){
  var t=e.target;if(t.type!=="checkbox")return;
  saved[t.dataset.k]=t.checked;store.set("exp-done-2day",JSON.stringify(saved));progress();
});

var current="day-1";
function spy(){
  var box=document.getElementById("toc-"+current);if(!box)return;
  var chaps=[].slice.call(document.querySelectorAll("#"+current+" .chap, #cp-"+current));
  var act=null;
  chaps.forEach(function(c){if(c.getBoundingClientRect().top<150)act=c;});
  [].forEach.call(box.querySelectorAll("a"),function(a){a.classList.toggle("on",!!act&&a.dataset.go===act.id);});
}
var tick=false;
window.addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(function(){spy();tick=false;});}},{passive:true});

function show(id){
  if(!DAYS.some(function(d){return d.id===id;}))id="day-1";
  current=id;var sel=null;
  [].forEach.call(tabs.querySelectorAll("[role=tab]"),function(b){
    var on=b.dataset.id===id;b.setAttribute("aria-selected",String(on));b.tabIndex=on?0:-1;if(on)sel=b;
  });
  DAYS.forEach(function(d){document.getElementById(d.id).hidden=(d.id!==id);document.getElementById("toc-"+d.id).hidden=(d.id!==id);});
  if(sel){ind.style.width=sel.offsetWidth+"px";ind.style.transform="translateX("+sel.offsetLeft+"px)";}
  spy();
}
tabs.addEventListener("click",function(e){
  var b=e.target.closest("[role=tab]");if(!b)return;location.hash=b.dataset.id;show(b.dataset.id);window.scrollTo(0,0);
});
tabs.addEventListener("keydown",function(e){
  var list=[].slice.call(tabs.querySelectorAll("[role=tab]")),i=list.indexOf(document.activeElement);
  if(i<0)return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){var n=list[(i+(e.key==="ArrowRight"?1:list.length-1))%list.length];n.focus();n.click();}
});
window.addEventListener("hashchange",function(){show(location.hash.slice(1));});
window.addEventListener("resize",function(){show(current);});

/* theme */
var root=document.documentElement;
root.dataset.theme=store.get("exp-mode")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
root.dataset.accent=store.get("exp-accent")||"pine";
function markDots(){[].forEach.call(document.querySelectorAll(".dot"),function(d){d.setAttribute("aria-pressed",String(d.dataset.a===root.dataset.accent));});}
document.querySelector(".dots").addEventListener("click",function(e){
  var d=e.target.closest(".dot");if(!d)return;root.dataset.accent=d.dataset.a;store.set("exp-accent",d.dataset.a);markDots();
});
document.getElementById("mode").addEventListener("click",function(){
  var n=root.dataset.theme==="dark"?"light":"dark";root.dataset.theme=n;store.set("exp-mode",n);
});
markDots();progress();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){show(location.hash.slice(1));});
show(location.hash.slice(1));
</script>
